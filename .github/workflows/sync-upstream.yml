name: Sync with Upstream Template

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Pull and Sync Files
        run: |
          git config --global user.name "arnav4o4"
          git config --global user.email "allenarnav2023@gmail.com"
          
          git clone https://github.com upstream_repo
          
          mkdir -p .github/workflows scripts
          cp -r upstream_repo/.github/workflows/* .github/workflows/
          cp -r upstream_repo/scripts/* scripts/
          
          rm -rf upstream_repo
          
          git add .github/workflows/ scripts/
          git diff-index --quiet HEAD || git commit -m "Automated Sync: Pulled latest scripts/workflows from upstream template"
          git push origin main
