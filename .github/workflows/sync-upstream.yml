name: Sync with Upstream Template

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          path: main_repo

      - name: Checkout upstream template
        uses: actions/checkout@v4
        with:
          repository: AVIVASHISHTA29/AVIVASHISHTA29
          path: upstream_repo

      - name: Pull and Sync Files
        run: |
          git config --global user.name "arnav4o4"
          git config --global user.email "allenarnav2023@gmail.com"
          
          # Ensure destination directories exist inside your repo
          mkdir -p main_repo/.github/workflows main_repo/scripts
          
          # Safely copy the engine framework
          cp -r upstream_repo/.github/workflows/* main_repo/.github/workflows/
          cp -r upstream_repo/scripts/* main_repo/scripts/
          
          # Move inside your repository folder to commit
          cd main_repo
          
          git add .github/workflows/ scripts/
          git diff-index --quiet HEAD || git commit -m "Automated Sync: Pulled latest scripts/workflows from upstream template"
          git push origin main
